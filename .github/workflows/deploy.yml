name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy PayloadCMS Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking on purpose. This previously ran with continue-on-error: true,
      # so a failed migration still shipped the app: the Worker would come up
      # expecting a schema that was never applied, and the only signal was a
      # warning line in the job summary. A stopped deploy is a much cheaper
      # failure than a live app talking to the wrong schema.
      - name: Run database migrations
        id: migrate
        run: pnpm run deploy:database
        env:
          CLOUDFLARE_ENV: ''
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Deploy to Cloudflare Workers
        run: pnpm run deploy:app
        env:
          CLOUDFLARE_ENV: ''
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Deployment summary
        run: |
          echo "Database migrations applied"
          echo "Backend deployed to Cloudflare Workers"
          echo "URL: https://login.hivconnectcentralnj.com"
